name: Bug report
description: Something in vaft-matlab doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest MATLAB code that shows the problem, including the full error message.
      render: matlab
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: vaft.doctor output
      description: Paste the output of `vaft.doctor` from the same MATLAB session.
      render: text
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 22.04, macOS 15 (arm64)
