name: MATLAB CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Run IMAS integration tests on the self-hosted runner
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (MATLAB ${{ matrix.release }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: [R2024b, latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.release }}

      - name: Code checks and unit tests
        uses: matlab-actions/run-build@v2
        with:
          tasks: check test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results-${{ matrix.release }}
          path: results/

  integration:
    name: IMAS integration tests
    # Self-hosted runner with a licensed MATLAB and an IMAS-MATLAB install
    # made by install/install_imas_matlab.sh. Never runs for pull requests:
    # this is a public repository and the runner is a real machine.
    # By default it runs only on manual dispatch (the runner is started on
    # demand). Set the repository variable IMAS_RUNNER=true once a runner
    # is permanently online to also run it on every push to main.
    if: >-
      github.event_name != 'pull_request' &&
      (vars.IMAS_RUNNER == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.integration))
    runs-on: [self-hosted, matlab, imas]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Acceptance (vaft.doctor + integration tests)
        # VAFT_IMAS_PREFIX may be set in the runner's .env; otherwise the
        # default prefix of install_imas_matlab.sh is used.
        run: bash install/install_imas_matlab.sh ${VAFT_IMAS_PREFIX:+--prefix "$VAFT_IMAS_PREFIX"} --check-only

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: results/
