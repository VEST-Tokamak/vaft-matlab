name: MATLAB CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Run IMAS integration tests on the self-hosted runner
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (MATLAB ${{ matrix.release }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: [R2024b, latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.release }}

      - name: Code checks and unit tests
        uses: matlab-actions/run-build@v2
        with:
          tasks: check test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results-${{ matrix.release }}
          path: results/

  integration:
    name: IMAS integration tests
    # Needs a self-hosted runner with a MATLAB license and IMAS-MATLAB,
    # whose environment already sources <install_dir>/bin/al_env.sh.
    if: vars.IMAS_RUNNER == 'true' || (github.event_name == 'workflow_dispatch' && inputs.integration)
    runs-on: [self-hosted, matlab, imas]
    steps:
      - uses: actions/checkout@v4

      - name: Integration tests
        uses: matlab-actions/run-build@v2
        with:
          tasks: integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: results/
